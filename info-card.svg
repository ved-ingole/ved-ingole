Python · C++ · JavaScript · HTML5
</text>

</g>


<g class="fade" style="animation-delay:3.85s">

<text class="item" x="42" y="437">
CSS · Java · SQL
</text>

</g>


<!-- Tools -->

<g class="fade" style="animation-delay:4.05s">

<text class="section" x="35" y="473">
TOOLS
