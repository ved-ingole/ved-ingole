<svg
xmlns="http://www.w3.org/2000/svg"
width="820"
height="650"
viewBox="0 0 820 650">

<style>

.terminal {
    fill: #0d1117;
    stroke: #30363d;
    stroke-width: 2;
}

.titlebar {
    fill: #161b22;
}

.title {
    font-family: "Courier New", monospace;
    font-size: 14px;
    fill: #8b949e;
}

.dot {
    fill: #484f58;
}

.code {
    font-family: "Courier New", monospace;
    font-size: 14px;
    fill: #c9d1d9;
}

.comment {
    font-family: "Courier New", monospace;
    font-size: 13px;
    fill: #6e7681;
}

.keyword {
    fill: #ffffff;
    font-weight: bold;
}

.string {
    fill: #d0d7de;
}

.function {
    fill: #ffffff;
    font-weight: bold;
}

.section {
    font-family: "Courier New", monospace;
    font-size: 14px;
    font-weight: bold;
    fill: #ffffff;
}

.item {
    font-family: "Courier New", monospace;
    font-size: 13px;
    fill: #c9d1d9;
}

.prompt {
    font-family: "Courier New", monospace;
    font-size: 13px;
    fill: #8b949e;
}

.type {
    opacity: 0;
    clip-path: inset(0 100% 0 0);
    animation: typeLine 0.75s steps(38, end) forwards;
}

.fade {
    opacity: 0;
    animation: fadeIn 0.45s ease-out forwards;
}

.cursor {
    fill: #c9d1d9;
    animation: blink 1s step-end infinite;
}

@keyframes typeLine {

    0% {
        opacity: 1;
        clip-path: inset(0 100% 0 0);
    }

    100% {
        opacity: 1;
        clip-path: inset(0 0 0 0);
    }

}

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

@keyframes blink {

    0%, 45% {
        opacity: 1;
    }

    46%, 100% {
        opacity: 0;
    }

}

</style>


<!-- Terminal -->

<rect
    class="terminal"
    x="1"
    y="1"
    width="818"
    height="648"
    rx="12"
    ry="12"
/>


<!-- Terminal title bar -->

<rect
    class="titlebar"
    x="2"
    y="2"
    width="816"
    height="38"
    rx="11"
    ry="11"
/>

<circle class="dot" cx="22" cy="21" r="6"/>
<circle class="dot" cx="42" cy="21" r="6"/>
<circle class="dot" cx="62" cy="21" r="6"/>

<text class="title" x="85" y="26">
Python Terminal — ved@github
</text>


<!-- Python startup -->

<g class="type" style="animation-delay:0.2s">

