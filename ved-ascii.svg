        viewBox="0 0 810 795">

<style>
    .ascii {
        font-family: "Courier New", monospace;
        font-size: 14px;
        font-weight: 400;
        fill: #d0d0d0;
    }

    .line {
        transform-origin: left center;
        animation: reveal 1.2s ease-out forwards;
    }

    @keyframes reveal {
        from {
            clip-path: inset(0 100% 0 0);
            opacity: 0;
        }

        to {
            clip-path: inset(0 0 0 0);
            opacity: 1;
        }
    }
</style>
